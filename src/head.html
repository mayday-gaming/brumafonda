<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Lanterna di Brumafonda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: fiaba notturna, calda e un po' buffa
   IDEA: un vecchio lampione-cartolina: la console è una cornice di ottone attorno a una valle in miniatura
   PICTURE: il gioco stesso, a tutto schermo, con luci dinamiche e lumini
   COLOUR and TYPE: viola notte #140e1c, ottone #c9a45a, lumino #eaff8a; Fredoka
   LAYOUT: canvas centrato; su touch joystick a sinistra e pulsanti a destra, sotto in verticale */
:root{color-scheme:dark;--bg:#0d0a14;--ink:#f5ecdc;--brass:#c9a45a;--fly:#eaff8a;--panel:#1b1326}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#22183a 0%,#0d0a14 70%);color:var(--ink);font:16px/1.5 Fredoka,"Trebuchet MS",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:52px}
body.touch:not(.portrait) #stage{padding-top:0}
body.portrait.touch #stage{padding-top:60px;bottom:230px;align-items:center}

#cv{display:block;border-radius:10px;box-shadow:0 0 0 2px #3a2a1a,0 0 0 5px var(--brass),0 0 0 7px #2a1d12,0 18px 60px rgba(0,0,0,.7),0 0 120px rgba(234,255,138,.06)}
#topbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:5}
#topbar button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--brass);background:rgba(27,19,38,.85);color:#ffe9b0;font:600 18px Fredoka,sans-serif;cursor:pointer}
#topbar button.off{opacity:.6}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:fixed;left:24px;bottom:28px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.03));border:2px solid rgba(201,164,90,.45);touch-action:none;z-index:4}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#c9a45a);box-shadow:0 4px 12px rgba(0,0,0,.5)}
#btns{position:fixed;right:20px;bottom:24px;width:180px;height:160px;z-index:4}
#btns button{position:absolute;border-radius:50%;border:2px solid rgba(0,0,0,.4);font:700 22px Fredoka,sans-serif;color:#1d1428;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.4)}
#btns button.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#bA{right:0;bottom:44px;width:78px;height:78px;background:radial-gradient(circle at 35% 30%,#fff1c2,#ffb84a)}
#bB{right:88px;bottom:4px;width:68px;height:68px;background:radial-gradient(circle at 35% 30%,#d9f0ff,#5fb0e8)}
#bC{right:100px;bottom:96px;width:48px;height:48px;font-size:18px!important;background:radial-gradient(circle at 35% 30%,#efe2ff,#a985e0)}
body.touch:not(.portrait) #joy{left:max(18px,env(safe-area-inset-left));bottom:30px}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.hidden{display:none!important}
#menu,#shop,#confirm{background:rgba(8,5,16,.6);backdrop-filter:blur(2px)}
#title{flex-direction:column;gap:18px;text-align:center;background:linear-gradient(transparent,rgba(13,10,20,.35))}
#logo{cursor:pointer;line-height:1}
#logo small{display:block;font-size:clamp(14px,2.5vw,18px);letter-spacing:.02em;color:#cdbfe0;font-weight:500;margin-bottom:6px}
#logo h1{margin:0;font-size:clamp(34px,7vw,64px);font-weight:700;color:#fff3d0;text-shadow:0 0 24px rgba(255,200,110,.55),0 4px 0 #6a3f1a;text-wrap:balance}
#logo.rainbow h1{background:linear-gradient(90deg,#ff7ab6,#ffd36b,#8dff7a,#5fe0ff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)}
.btn{min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--brass);background:#2a1d3a;color:#ffe9b0;font:600 16px Fredoka,sans-serif;cursor:pointer}
.btn:hover:not(:disabled){background:#3a2850}.btn:focus-visible{outline:3px solid var(--fly);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.main{background:linear-gradient(#ffcf6b,#e09a3a);color:#2a1608;border-color:#7a4a1a;font-size:18px}
.tnote{font-size:13px;color:#a99bbf;max-width:420px}
.panel{width:min(640px,96vw);max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--brass);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.ph h3{margin:0;font-size:20px;color:#fff3d0}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 0}
#tabs button{flex:none;min-height:40px;padding:6px 12px;border-radius:10px 10px 0 0;border:1px solid #4a3a5a;border-bottom:0;background:#241a32;color:#cdbfe0;font:500 14px Fredoka,sans-serif;cursor:pointer}
#tabs button.on{background:#33264a;color:#ffe9b0;border-color:var(--brass)}
.pb{overflow-y:auto;padding:14px 16px 18px;border-top:1px solid #4a3a5a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#251b33;border:1.5px solid #4a3a5a;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.card img{width:40px;height:40px}.card b{font-size:14px;color:#ffe9b0}.card span{font-size:13px;color:#cdbfe0;line-height:1.35}
.card.sel{border-color:#9fd8ff;box-shadow:0 0 0 2px rgba(159,216,255,.3)}.card.locked{opacity:.45}
h4{margin:16px 0 8px;color:#ffcf6b;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:#2f2340;font-size:13px;color:#fff3d0}.pill img{width:20px;height:20px}.pill.off{opacity:.45}
.hint{font-size:13px;color:#a99bbf;margin:12px 0 0}
.map{display:grid;gap:4px}
.mc{position:relative;aspect-ratio:16/11;border-radius:6px;background:#1f1729;border:1px dashed #3a2e48;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.mc span{font-size:11px;line-height:1.15;color:#6a5a7e}.mc.vis{background:#3a5a3e;border:1px solid #6a9a5a}.mc.vis span{color:#f0ffe0}.mc.boss.vis{background:#5a2a3a;border-color:#c96a7a}
.mc.here{outline:2px solid var(--fly)}.mc em{position:absolute;top:2px;right:5px;color:var(--fly);font-style:normal;font-size:12px}.mc i{position:absolute;bottom:2px;left:4px;color:var(--fly);font-style:normal;font-size:11px}.mc.none{visibility:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stats div{background:#251b33;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}.stats img{width:30px;height:30px}.stats b{font-size:18px;color:#ffe9b0}.stats b.big{font-size:22px}.stats span{font-size:13px;color:#a99bbf}
.page{background:#f3e6c4;color:#4a3420;border-radius:6px;padding:10px 14px;margin-bottom:10px;font-family:Georgia,serif}.page b{font-family:Fredoka,sans-serif;color:#7a5a3a}.page p{margin:4px 0 0}.page.off{opacity:.3}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.tr{background:#2a1f38;border-radius:10px;padding:8px 10px;border:1px solid #5a4a3a}.tr b{display:block;font-size:14px;color:#ffe9b0}.tr span{font-size:12.5px;color:#cdbfe0}.tr.off{opacity:.5;border-color:#3a2e48}
table.keys{border-collapse:collapse;width:100%;font-size:14px}table.keys td{padding:6px 4px;border-bottom:1px solid #3a2e48}table.keys td:last-child{color:#ffe9b0;text-align:right}
.wallet{display:flex;align-items:center;gap:6px;margin:0 0 10px;color:#ffe9d6}.wallet img{width:24px;height:24px}
.shopit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:12px;background:#251b33;margin-bottom:8px}.shopit b{display:block;color:#ffe9b0}.shopit span{font-size:13px;color:#cdbfe0}.shopit .btn{flex:none;min-width:84px}.shopit.sold{opacity:.5}
#confirm .panel{padding:20px;gap:14px;text-align:center;width:min(380px,92vw)}

/* --- finestre stile Final Fantasy --- */
.panel{background:linear-gradient(180deg,#3a5ad0 0%,#22389e 45%,#101c62 100%)!important;border:2px solid #eef1ff!important;outline:1px solid #0a1030;box-shadow:inset 0 0 0 2px rgba(120,140,220,.55),0 4px 0 rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.7)!important;border-radius:10px!important;color:#fff;text-shadow:1px 1px 0 rgba(8,12,40,.9)}
.ph h3{color:#fff!important}
.pb{border-top:1px solid rgba(238,241,255,.35)!important}
.btn{background:linear-gradient(180deg,#3a5ad0,#16257a)!important;border:2px solid #eef1ff!important;color:#fff!important;text-shadow:1px 1px 0 #0a1030;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.main{background:linear-gradient(180deg,#ffe08a,#e0a03a)!important;color:#2a1608!important;text-shadow:none;border-color:#fff7d8!important}
.tbtns .btn{position:relative;text-align:left;padding-left:34px}
.tbtns .btn:hover::before,.tbtns .btn:focus-visible::before{content:'▶';position:absolute;left:12px;color:#fff;animation:hand .6s ease-in-out infinite alternate}
@keyframes hand{to{transform:translateX(4px)}}
#tabs button{background:rgba(10,16,60,.5)!important;color:#c8d0ff!important;border:1px solid rgba(238,241,255,.35)!important;border-bottom:0!important}
#tabs button.on{background:rgba(255,255,255,.14)!important;color:#fff!important}
#tabs button.on::before{content:'▶ ';color:#ffe08a}
.card,.stats div,.shopit,.tr{background:rgba(8,14,60,.55)!important;border:1px solid rgba(238,241,255,.25)!important}
.card b,.stats b,.shopit b,.tr b{color:#ffe08a!important}.card span,.stats span,.shopit span,.tr span,.hint{color:#d6dcff!important}
.card.sel{border-color:#ffe08a!important;box-shadow:0 0 0 2px rgba(255,224,138,.35)}
.card.sel b::before{content:'▶ '}
h4{color:#ffe08a!important}
.pill{background:rgba(8,14,60,.6)!important;border:1px solid rgba(238,241,255,.25)}
.mc{background:rgba(8,14,60,.5)!important;border-color:rgba(238,241,255,.2)!important}.mc.vis{background:#2f6a4a!important;border:1px solid #9be0a0!important}.mc.boss.vis{background:#7a2a3a!important}
table.keys td{border-bottom:1px solid rgba(238,241,255,.2)!important}table.keys td:last-child{color:#ffe08a!important}
.page{text-shadow:none}
#topbar button{background:linear-gradient(180deg,#3a5ad0,#16257a)!important;border:2px solid #eef1ff!important;color:#fff!important}
@media (prefers-reduced-motion:reduce){#knob{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Schermo di gioco"></canvas></div>
<div id="topbar"><button id="bMute" aria-label="Audio">♪</button><button id="bPip" aria-label="Chiedi a Pip">✦</button><button id="bMenu" aria-label="Menu">☰</button></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="btns"><button id="bC" aria-label="Cambia oggetto">⟳</button><button id="bB">B</button><button id="bA">A</button></div></div>

<div id="title" class="ov">
 <div id="logo" title=""><small>Ilio, Pip e la notte senza fine</small><h1>La Lanterna<br>di Brumafonda</h1></div>
 <div class="tbtns"><button class="btn main" id="btnNew">Nuova avventura</button><button class="btn" id="btnCont" disabled>Continua</button></div>
 <p class="tnote">Frecce/WASD per muoverti · Spazio = A · K = B · Q cambia oggetto · P chiede a Pip · Esc menu. Su telefono usa i comandi a schermo.</p>
</div>
<div id="confirm" class="ov hidden"><div class="panel"><b>Iniziare una nuova avventura?</b><span style="color:#cdbfe0;font-size:14px">Il salvataggio attuale verrà cancellato.</span><div class="row" style="justify-content:center"><button class="btn" id="cNo">Annulla</button><button class="btn main" id="cYes">Ricomincia</button></div></div></div>
<div id="menu" class="ov hidden"><div class="panel"><div class="ph"><h3>Zaino di Ilio</h3><button class="btn" id="menuClose">Chiudi</button></div>
 <div id="tabs"><button data-t="missione">Missione</button><button data-t="zaino">Zaino</button><button data-t="mappa">Mappa</button><button data-t="collezione">Collezione</button><button data-t="diario">Diario</button><button data-t="trofei">Trofei</button><button data-t="opzioni">Opzioni</button></div>
 <div class="pb" id="menuBody"></div></div></div>
<div id="shop" class="ov hidden"><div class="panel"><div class="ph"><h3>Bottega di Ciottolo</h3><button class="btn" id="shopClose">Arrivederci</button></div><div class="pb" id="shopBody"></div></div></div>
<script>
document.body.classList.toggle('touch', matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window);
{
