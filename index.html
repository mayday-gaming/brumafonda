<!DOCTYPE html>
<html lang="it">

<title>La Lanterna di Brumafonda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

/* VOICE: fiaba notturna, calda e un po' buffa
   IDEA: un vecchio lampione-cartolina: la console è una cornice di ottone attorno a una valle in miniatura
   PICTURE: il gioco stesso, a tutto schermo, con luci dinamiche e lumini
   COLOUR and TYPE: viola notte #140e1c, ottone #c9a45a, lumino #eaff8a; Fredoka
   LAYOUT: canvas centrato; su touch joystick a sinistra e pulsanti a destra, sotto in verticale */
:root{color-scheme:dark;--bg:#0d0a14;--ink:#f5ecdc;--brass:#c9a45a;--fly:#eaff8a;--panel:#1b1326}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#22183a 0%,#0d0a14 70%);color:var(--ink);font:16px/1.5 Fredoka,"Trebuchet MS",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:52px}
body.touch:not(.portrait) #stage{padding-top:0}
body.portrait.touch #stage{padding-top:60px;bottom:230px;align-items:center}

#cv{display:block;border-radius:10px;box-shadow:0 0 0 2px #3a2a1a,0 0 0 5px var(--brass),0 0 0 7px #2a1d12,0 18px 60px rgba(0,0,0,.7),0 0 120px rgba(234,255,138,.06)}
#topbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:5}
#topbar button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--brass);background:rgba(27,19,38,.85);color:#ffe9b0;font:600 18px Fredoka,sans-serif;cursor:pointer}
#topbar button.off{opacity:.6}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:fixed;left:24px;bottom:28px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.03));border:2px solid rgba(201,164,90,.45);touch-action:none;z-index:4}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#c9a45a);box-shadow:0 4px 12px rgba(0,0,0,.5)}
#btns{position:fixed;right:20px;bottom:24px;width:180px;height:160px;z-index:4}
#btns button{position:absolute;border-radius:50%;border:2px solid rgba(0,0,0,.4);font:700 22px Fredoka,sans-serif;color:#1d1428;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.4)}
#btns button.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#bA{right:0;bottom:44px;width:78px;height:78px;background:radial-gradient(circle at 35% 30%,#fff1c2,#ffb84a)}
#bB{right:88px;bottom:4px;width:68px;height:68px;background:radial-gradient(circle at 35% 30%,#d9f0ff,#5fb0e8)}
#bC{right:100px;bottom:96px;width:48px;height:48px;font-size:18px!important;background:radial-gradient(circle at 35% 30%,#efe2ff,#a985e0)}
body.touch:not(.portrait) #joy{left:max(18px,env(safe-area-inset-left));bottom:30px}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.hidden{display:none!important}
#menu,#shop,#confirm{background:rgba(8,5,16,.6);backdrop-filter:blur(2px)}
#title{flex-direction:column;gap:18px;text-align:center;background:linear-gradient(transparent,rgba(13,10,20,.35))}
#logo{cursor:pointer;line-height:1}
#logo small{display:block;font-size:clamp(14px,2.5vw,18px);letter-spacing:.02em;color:#cdbfe0;font-weight:500;margin-bottom:6px}
#logo h1{margin:0;font-size:clamp(34px,7vw,64px);font-weight:700;color:#fff3d0;text-shadow:0 0 24px rgba(255,200,110,.55),0 4px 0 #6a3f1a;text-wrap:balance}
#logo.rainbow h1{background:linear-gradient(90deg,#ff7ab6,#ffd36b,#8dff7a,#5fe0ff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)}
.btn{min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--brass);background:#2a1d3a;color:#ffe9b0;font:600 16px Fredoka,sans-serif;cursor:pointer}
.btn:hover:not(:disabled){background:#3a2850}.btn:focus-visible{outline:3px solid var(--fly);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.main{background:linear-gradient(#ffcf6b,#e09a3a);color:#2a1608;border-color:#7a4a1a;font-size:18px}
.tnote{font-size:13px;color:#a99bbf;max-width:420px}
.panel{width:min(640px,96vw);max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--brass);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.ph h3{margin:0;font-size:20px;color:#fff3d0}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 0}
#tabs button{flex:none;min-height:40px;padding:6px 12px;border-radius:10px 10px 0 0;border:1px solid #4a3a5a;border-bottom:0;background:#241a32;color:#cdbfe0;font:500 14px Fredoka,sans-serif;cursor:pointer}
#tabs button.on{background:#33264a;color:#ffe9b0;border-color:var(--brass)}
.pb{overflow-y:auto;padding:14px 16px 18px;border-top:1px solid #4a3a5a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#251b33;border:1.5px solid #4a3a5a;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.card img{width:40px;height:40px}.card b{font-size:14px;color:#ffe9b0}.card span{font-size:13px;color:#cdbfe0;line-height:1.35}
.card.sel{border-color:#9fd8ff;box-shadow:0 0 0 2px rgba(159,216,255,.3)}.card.locked{opacity:.45}
h4{margin:16px 0 8px;color:#ffcf6b;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:#2f2340;font-size:13px;color:#fff3d0}.pill img{width:20px;height:20px}.pill.off{opacity:.45}
.hint{font-size:13px;color:#a99bbf;margin:12px 0 0}
.map{display:grid;gap:4px}
.mc{position:relative;aspect-ratio:16/11;border-radius:6px;background:#1f1729;border:1px dashed #3a2e48;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.mc span{font-size:11px;line-height:1.15;color:#6a5a7e}.mc.vis{background:#3a5a3e;border:1px solid #6a9a5a}.mc.vis span{color:#f0ffe0}.mc.boss.vis{background:#5a2a3a;border-color:#c96a7a}
.mc.here{outline:2px solid var(--fly)}.mc em{position:absolute;top:2px;right:5px;color:var(--fly);font-style:normal;font-size:12px}.mc i{position:absolute;bottom:2px;left:4px;color:var(--fly);font-style:normal;font-size:11px}.mc.none{visibility:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stats div{background:#251b33;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}.stats img{width:30px;height:30px}.stats b{font-size:18px;color:#ffe9b0}.stats b.big{font-size:22px}.stats span{font-size:13px;color:#a99bbf}
.page{background:#f3e6c4;color:#4a3420;border-radius:6px;padding:10px 14px;margin-bottom:10px;font-family:Georgia,serif}.page b{font-family:Fredoka,sans-serif;color:#7a5a3a}.page p{margin:4px 0 0}.page.off{opacity:.3}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.tr{background:#2a1f38;border-radius:10px;padding:8px 10px;border:1px solid #5a4a3a}.tr b{display:block;font-size:14px;color:#ffe9b0}.tr span{font-size:12.5px;color:#cdbfe0}.tr.off{opacity:.5;border-color:#3a2e48}
table.keys{border-collapse:collapse;width:100%;font-size:14px}table.keys td{padding:6px 4px;border-bottom:1px solid #3a2e48}table.keys td:last-child{color:#ffe9b0;text-align:right}
.wallet{display:flex;align-items:center;gap:6px;margin:0 0 10px;color:#ffe9d6}.wallet img{width:24px;height:24px}
.shopit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:12px;background:#251b33;margin-bottom:8px}.shopit b{display:block;color:#ffe9b0}.shopit span{font-size:13px;color:#cdbfe0}.shopit .btn{flex:none;min-width:84px}.shopit.sold{opacity:.5}
#confirm .panel{padding:20px;gap:14px;text-align:center;width:min(380px,92vw)}

/* --- finestre stile Final Fantasy --- */
.panel{background:linear-gradient(180deg,#3a5ad0 0%,#22389e 45%,#101c62 100%)!important;border:2px solid #eef1ff!important;outline:1px solid #0a1030;box-shadow:inset 0 0 0 2px rgba(120,140,220,.55),0 4px 0 rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.7)!important;border-radius:10px!important;color:#fff;text-shadow:1px 1px 0 rgba(8,12,40,.9)}
.ph h3{color:#fff!important}
.pb{border-top:1px solid rgba(238,241,255,.35)!important}
.btn{background:linear-gradient(180deg,#3a5ad0,#16257a)!important;border:2px solid #eef1ff!important;color:#fff!important;text-shadow:1px 1px 0 #0a1030;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.main{background:linear-gradient(180deg,#ffe08a,#e0a03a)!important;color:#2a1608!important;text-shadow:none;border-color:#fff7d8!important}
.tbtns .btn{position:relative;text-align:left;padding-left:34px}
.tbtns .btn:hover::before,.tbtns .btn:focus-visible::before{content:'▶';position:absolute;left:12px;color:#fff;animation:hand .6s ease-in-out infinite alternate}
@keyframes hand{to{transform:translateX(4px)}}
#tabs button{background:rgba(10,16,60,.5)!important;color:#c8d0ff!important;border:1px solid rgba(238,241,255,.35)!important;border-bottom:0!important}
#tabs button.on{background:rgba(255,255,255,.14)!important;color:#fff!important}
#tabs button.on::before{content:'▶ ';color:#ffe08a}
.card,.stats div,.shopit,.tr{background:rgba(8,14,60,.55)!important;border:1px solid rgba(238,241,255,.25)!important}
.card b,.stats b,.shopit b,.tr b{color:#ffe08a!important}.card span,.stats span,.shopit span,.tr span,.hint{color:#d6dcff!important}
.card.sel{border-color:#ffe08a!important;box-shadow:0 0 0 2px rgba(255,224,138,.35)}
.card.sel b::before{content:'▶ '}
h4{color:#ffe08a!important}
.pill{background:rgba(8,14,60,.6)!important;border:1px solid rgba(238,241,255,.25)}
.mc{background:rgba(8,14,60,.5)!important;border-color:rgba(238,241,255,.2)!important}.mc.vis{background:#2f6a4a!important;border:1px solid #9be0a0!important}.mc.boss.vis{background:#7a2a3a!important}
table.keys td{border-bottom:1px solid rgba(238,241,255,.2)!important}table.keys td:last-child{color:#ffe08a!important}
.page{text-shadow:none}
#topbar button{background:linear-gradient(180deg,#3a5ad0,#16257a)!important;border:2px solid #eef1ff!important;color:#fff!important}
@media (prefers-reduced-motion:reduce){#knob{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Schermo di gioco"></canvas></div>
<div id="topbar"><button id="bMute" aria-label="Audio">♪</button><button id="bPip" aria-label="Chiedi a Pip">✦</button><button id="bMenu" aria-label="Menu">☰</button></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="btns"><button id="bC" aria-label="Cambia oggetto">⟳</button><button id="bB">B</button><button id="bA">A</button></div></div>

<div id="title" class="ov">
 <div id="logo" title=""><small>Ilio, Pip e la notte senza fine</small><h1>La Lanterna<br>di Brumafonda</h1></div>
 <div class="tbtns"><button class="btn main" id="btnNew">Nuova avventura</button><button class="btn" id="btnCont" disabled>Continua</button></div>
 <p class="tnote">Frecce/WASD per muoverti · Spazio = A · K = B · Q cambia oggetto · P chiede a Pip · Esc menu. Su telefono usa i comandi a schermo.</p>
</div>
<div id="confirm" class="ov hidden"><div class="panel"><b>Iniziare una nuova avventura?</b><span style="color:#cdbfe0;font-size:14px">Il salvataggio attuale verrà cancellato.</span><div class="row" style="justify-content:center"><button class="btn" id="cNo">Annulla</button><button class="btn main" id="cYes">Ricomincia</button></div></div></div>
<div id="menu" class="ov hidden"><div class="panel"><div class="ph"><h3>Zaino di Ilio</h3><button class="btn" id="menuClose">Chiudi</button></div>
 <div id="tabs"><button data-t="missione">Missione</button><button data-t="zaino">Zaino</button><button data-t="mappa">Mappa</button><button data-t="collezione">Collezione</button><button data-t="diario">Diario</button><button data-t="trofei">Trofei</button><button data-t="opzioni">Opzioni</button></div>
 <div class="pb" id="menuBody"></div></div></div>
<div id="shop" class="ov hidden"><div class="panel"><div class="ph"><h3>Bottega di Ciottolo</h3><button class="btn" id="shopClose">Arrivederci</button></div><div class="pb" id="shopBody"></div></div></div>

function resize(){
  const portrait = innerHeight>innerWidth;
  let aw=innerWidth, ah=innerHeight;
  if(isTouch){ if(portrait) ah=innerHeight-290; else aw=innerWidth-300; } else ah-=56;
  aw-=8; ah-=8;
  const s=Math.max(0.4,Math.min(aw/GW, ah/GH));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=(GW*s)+'px'; cv.style.height=(GH*s)+'px';
  K=s*dpr; CSS_S=s;
  cv.width=Math.round(GW*K); cv.height=Math.round(GH*K);
  document.body.classList.toggle('portrait',portrait);
  if(snapCv){snapCv.width=cv.width;snapCv.height=cv.height;}
}

   case 'boss': T.tone(55,1.2,'sawtooth',0.15,0.5); T.noise(1,0.2,200,0,'lowpass'); break;
   case 'bubble': T.tone(rand(300,500),0.12,'sine',0.08,2.5); break;
   case 'meow': T.tone(700,0.35,'triangle',0.08,0.6); T.tone(900,0.2,'sine',0.04,0.7,0.05); break;
   case 'warp': T.tone(200,0.8,'sine',0.1,4); T.noise(0.8,0.1,800,0,'bandpass',4); break;
   case 'menu': T.tone(660,0.06,'triangle',0.06); break;
  }
 },
 frog(i){ const notes=[0,4,7,12]; this.tone(196*2**(notes[i]/12),0.35,'square',0.08,0.98); this.tone(98*2**(notes[i]/12),0.3,'sine',0.1); },
 setMusic(n){ if(this.cur===n) return; this.cur=n; this.step=0; if(this.ctx) this.next=this.ctx.currentTime+0.15; },
 patt(name){
  if(this.pat[name]) return this.pat[name];
  const th=MUS[name]; let s=th.seed*9301+49297; const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const mel=[]; let deg=2;
  for(let i=0;i<64;i++){
    if(i%16>=8 && i<32) { mel.push(mel[i-8]); continue; } // ripetizione del motivo
    if(r()<0.38 && i%2===1){ mel.push(null); continue; }
    deg+= Math.round((r()-0.5)*3); deg=clamp(deg,0,9);
    mel.push(Math.floor(deg/5)*12+th.scale[deg%5]);
  }
  return this.pat[name]=mel;
 },
 sched(){
  if(!this.ctx||!this.cur||this.muted) { if(this.ctx) this.next=Math.max(this.next,this.ctx.currentTime); return; }
  const th=MUS[this.cur], mel=this.patt(this.cur), spb=60/th.bpm/2;
  if(this.next<this.ctx.currentTime) this.next=this.ctx.currentTime+0.05;
  while(this.next<this.ctx.currentTime+0.25){
   const st=this.step, t=this.next-this.ctx.currentTime, bar=Math.floor(st/8)%4, base=th.root+th.prog[bar];
   const n=mel[st%64];
   if(n!==null) this.tone(440*2**((th.root+12+n-69)/12), spb*1.8, th.lead, th.drums?0.045:0.07, 0, t, this.mus);
   if(st%8===0){ this.tone(440*2**((base-12-69)/12), spb*7.5,'triangle',0.11,0,t,this.mus);
     [0,4,7].forEach(iv=>this.tone(440*2**((base+iv-69)/12), spb*7,'sine',0.025,0,t,this.mus)); }
   if(st%8===4) this.tone(440*2**((base-12+7-69)/12), spb*3,'triangle',0.08,0,t,this.mus);
   if(th.drums){ if(st%4===0) this.tone(110,0.15,'sine',0.25,0.3,t,this.mus); if(st%4===2) this.noise(0.08,0.06,6000,t,'highpass',0,this.mus); if(st%8===4) this.noise(0.15,0.12,1500,t,'bandpass',0,this.mus); }
   this.step++; this.next+=spb;
  }
 }
};

// solidità per il giocatore
function solidP(tx,ty,ign){
 if(tx<0||tx>=CW||ty<0||ty>=CH){
  const ex=clamp(tx,0,CW-1), ey=clamp(ty,0,CH-1);
  const dx=tx<0?-1:tx>=CW?1:0, dy=ty<0?-1:ty>=CH?1:0;
  if(!neighborKey(dx,dy)) return true;
  return solidP(ex,ey,ign);
 }
 const c=room.grid[ty][tx];
 if(ign&&ign.has(tx+','+ty)&&'J[]'.includes(c)) return false;
 if(c==='J') return !room.jOpen;
 if(c==='M') return S.flames<3;
 if(c==='[') return room.crystal===0;
 if(c===']') return room.crystal===1;
 if(c==='W') return true;
 if(SOLID.includes(c)) return true;
 if(blockAt(tx,ty)) return true;
 return false;
}

}

function moveBox(e,dx,dy,fn,hw=7,ht=6,hb=3,nudge=false,ign){
 let hitX=null, hitY=null;
 if(dx){ const nx=e.x+dx; const h=boxHit(nx-hw,e.y-ht,nx+hw,e.y+hb,fn,ign);
  if(!h) e.x=nx; else { hitX=h;
   if(nudge){ for(let o=1;o<=11;o++){ let done=false; for(const s of [-1,1]){ const oy=e.y+s*o;
     if(!boxHit(nx-hw,oy-ht,nx+hw,oy+hb,fn,ign)){ e.y+=s*Math.min(o,Math.abs(dx)+0.6); done=true; break; } } if(done) break; } }
  } }
 if(dy){ const ny=e.y+dy; const h=boxHit(e.x-hw,ny-ht,e.x+hw,ny+hb,fn,ign);
  if(!h) e.y=ny; else { hitY=h;
   if(nudge){ for(let o=1;o<=11;o++){ let done=false; for(const s of [-1,1]){ const ox=e.x+s*o;
     if(!boxHit(ox-hw,ny-ht,ox+hw,ny+hb,fn,ign)){ e.x+=s*Math.min(o,Math.abs(dy)+0.6); done=true; break; } } if(done) break; } }
  } }
 return {hitX,hitY};
}

  if(ok){ room.jOpen=true; S.got[room.key+'|clear']=1; AU.sfx('open'); shake=6; floatText(P.x,P.y-40,'Un passaggio si è aperto!','#ffe9a8'); save(); }
 }

}

 if('.,PSw_='.includes(c)){ if(c==='='){ drawWaterBase(g,x,y); g.fillStyle='#9a6b3f'; g.fillRect(x,y+3,TS,TS-6); g.strokeStyle='#6d4727'; g.lineWidth=2; for(let i=0;i<4;i++){g.beginPath();g.moveTo(x+i*8+4,y+3);g.lineTo(x+i*8+4,y+TS-3);g.stroke();} g.fillStyle='rgba(255,220,160,.2)'; g.fillRect(x,y+3,TS,3); return;}
   drawGround(g,c,x,y,tx,ty); return; }
 if(c==='W'){ drawWaterBase(g,x,y); // schiuma ai bordi
   g.strokeStyle='rgba(220,250,255,.55)'; g.lineWidth=2.5;

   if(tileAt(tx,ty-1)!=='G'){ const gr=g.createLinearGradient(0,y,0,y+14); gr.addColorStop(0,room.w==='ow'?'#6b5a48':th.wallTop); gr.addColorStop(1,'#07050c'); g.fillStyle=gr; g.fillRect(x,y,TS,14); }
   g.fillStyle='rgba(120,100,180,.12)'; circ(g,x+16,y+20,3); g.fill(); return; }
 if(c==='#'||(c==='Z'&&room.w!=='ow')){ const below=tileAt(tx,ty+1); const face=below!==null&&below!=='#'&&below!=='Z';
   g.fillStyle=th.wallTop; g.fillRect(x,y,TS,TS); g.fillStyle=th.wall; g.fillRect(x+1,y+1,TS-2,TS-2);
   g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; for(let r=0;r<4;r++){ g.beginPath(); g.moveTo(x,y+r*8+0.5); g.lineTo(x+TS,y+r*8+0.5); g.stroke(); const o=(r%2)*8; for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(x+o+k*16+0.5,y+r*8); g.lineTo(x+o+k*16+0.5,y+r*8+8); g.stroke(); } }
   if(face){ g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(x,y+TS-9,TS,9); g.fillStyle=th.wallTop; g.globalAlpha=0.35; g.fillRect(x,y+TS-10,TS,1.5); g.globalAlpha=1; }
   if(c==='Z'){ drawCracks(g,x,y,'#d9ecff'); }
   return; }
 if(c==='O'&&[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>tileAt(tx+a,ty+b)==='W').length>=2) drawWaterBase(g,x,y); else drawGround(g,baseFor(c),x,y,tx,ty);
 switch(c){
  case 'T': { g.fillStyle='rgba(46,28,72,.22)'; g.beginPath(); g.ellipse(x+26,y+28,20,7,0.3,0,6.28); g.fill(); g.fillStyle='rgba(46,28,72,.28)'; ell(g,x+16,y+27,12,4.5); g.fill(); g.fillStyle='#6b4630'; rr(g,x+12.5,y+14,7,15,2); g.fill(); g.fillStyle='rgba(255,220,180,.18)'; g.fillRect(x+13.5,y+15,2,12); break;
    g.fillStyle='#5b3a24'; g.fillRect(x+13,y+18,6,10);
    const dk=room.key==='ow:3,1'||room.key==='ow:0,3'; const cols=dk?['#2c4a35','#355840','#406b4b']:['#2f6b3a','#3b8146','#4e9a54'];
    g.fillStyle=cols[0]; circ(g,x+16,y+13,15); g.fill(); g.fillStyle=cols[1]; circ(g,x+12,y+11,10); g.fill(); circ(g,x+21,y+12,9); g.fill(); g.fillStyle=cols[2]; circ(g,x+11,y+7,6); g.fill(); circ(g,x+19,y+6,4.5); g.fill();
    if(h>0.7){ g.fillStyle='#e05a4a'; circ(g,x+9+h*10,y+14,2); g.fill(); } break; }
  case 'R': { g.fillStyle='rgba(0,0,0,.25)'; ell(g,x+16,y+27,14,5); g.fill(); g.fillStyle='#6f7378'; g.beginPath(); g.moveTo(x+3,y+26); g.lineTo(x+5,y+10); g.lineTo(x+14,y+3); g.lineTo(x+26,y+6); g.lineTo(x+30,y+20); g.lineTo(x+26,y+28); g.closePath(); g.fill(); g.fillStyle='#8e9398'; g.beginPath(); g.moveTo(x+6,y+12); g.lineTo(x+14,y+5); g.lineTo(x+24,y+8); g.lineTo(x+18,y+14); g.closePath(); g.fill(); g.strokeStyle='rgba(0,0,0,.2)'; g.beginPath(); g.moveTo(x+18,y+14); g.lineTo(x+20,y+24); g.stroke(); break; }
  case 'Z': { // roccia incrinata (overworld)
    g.fillStyle='#7a7166'; g.beginPath(); g.moveTo(x+3,y+28); g.lineTo(x+4,y+8); g.lineTo(x+16,y+2); g.lineTo(x+28,y+8); g.lineTo(x+29,y+28); g.closePath(); g.fill(); drawCracks(g,x,y,'#f4e9d0'); break; }
  case 'B': { g.fillStyle='rgba(0,0,0,.22)'; ell(g,x+16,y+26,13,5); g.fill(); g.fillStyle='#3f8a3c'; circ(g,x+16,y+17,11); g.fill(); g.fillStyle='#55a84b'; circ(g,x+11,y+14,6); g.fill(); circ(g,x+20,y+13,6); g.fill(); g.fillStyle='#7cc565'; circ(g,x+13,y+11,2.5); g.fill(); circ(g,x+21,y+10,2); g.fill(); break; }
  case 'V': { g.strokeStyle='#4b1f37'; g.lineWidth=4; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+2,y+8+i*9); g.bezierCurveTo(x+10,y+i*9,x+20,y+16+i*9,x+30,y+6+i*9); g.stroke(); }
    g.strokeStyle='#7a3358'; g.lineWidth=2; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+2,y+8+i*9); g.bezierCurveTo(x+10,y+i*9,x+20,y+16+i*9,x+30,y+6+i*9); g.stroke(); }
    g.fillStyle='#d9a3c4'; for(let i=0;i<7;i++){ const sx=x+hash(tx,ty,i)*28+2, sy=y+hash(tx,ty,i+3)*28+2; g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+2,sy-4); g.lineTo(sx+4,sy); g.fill(); } break; }
  case 'F': { g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(x,y+24,TS,4); g.fillStyle='#a77a4c'; g.fillRect(x,y+10,TS,4); g.fillRect(x,y+18,TS,4); g.fillStyle='#8a6038'; g.fillRect(x+4,y+6,5,20); g.fillRect(x+21,y+6,5,20); break; }
  case 'H': { const roof=tileAt(tx,ty-1)!=='H';
    if(roof){ g.fillStyle='#b5523b'; g.fillRect(x,y+4,TS,TS-4); g.fillStyle='#cf6a4c'; for(let r=0;r<3;r++) for(let k=0;k<4;k++){ rr(g,x+k*8+(r%2)*4-2,y+6+r*8,8,7,3); g.fill(); } g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x,y+TS-3,TS,3);
     if(tileAt(tx-1,ty)!=='H'){ g.fillStyle='#8f3f2d'; g.fillRect(x,y+4,3,TS-4);} if(tileAt(tx+1,ty)!=='H'){ g.fillStyle='#8f3f2d'; g.fillRect(x+TS-3,y+4,3,TS-4);} }
    else { g.fillStyle='#eadbb8'; g.fillRect(x,y,TS,TS); g.fillStyle='#8a6038'; g.fillRect(x,y,TS,3); g.fillRect(x,y+TS-4,TS,4); if(tileAt(tx-1,ty)!=='H') g.fillRect(x,y,4,TS); if(tileAt(tx+1,ty)!=='H') g.fillRect(x+TS-4,y,4,TS);
     if((tx+ty)%2===0){ g.fillStyle='#ffd27a'; rr(g,x+9,y+8,14,12,2); g.fill(); g.strokeStyle='#6d4727'; g.lineWidth=2; g.strokeRect(x+9,y+8,14,12); g.beginPath(); g.moveTo(x+16,y+8); g.lineTo(x+16,y+20); g.stroke(); }
     else { g.fillStyle='#6d4727'; rr(g,x+9,y+8,14,20,3); g.fill(); g.fillStyle='#ffcf6b'; circ(g,x+20,y+19,1.5); g.fill(); } }
    break; }
  case 's': { g.fillStyle='rgba(0,0,0,.25)'; ell(g,x+16,y+27,9,3); g.fill(); g.fillStyle='#7a5230'; g.fillRect(x+14,y+14,4,14); g.fillStyle='#b8874f'; rr(g,x+5,y+5,22,13,2); g.fill(); g.strokeStyle='#7a5230'; g.lineWidth=1.5; g.strokeRect(x+5,y+5,22,13); g.strokeStyle='rgba(80,50,20,.6)'; g.lineWidth=1; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+8,y+9+i*3); g.lineTo(x+24-i*3,y+9+i*3); g.stroke(); } break; }
  case 'g': { g.fillStyle='rgba(0,0,0,.3)'; ell(g,x+16,y+27,10,4); g.fill(); g.fillStyle='#8b8f99'; g.beginPath(); g.moveTo(x+7,y+27); g.lineTo(x+7,y+12); g.arc(x+16,y+12,9,Math.PI,0); g.lineTo(x+25,y+27); g.closePath(); g.fill(); g.fillStyle='#a8adb8'; g.fillRect(x+9,y+11,3,15); g.strokeStyle='#5c606a'; g.lineWidth=1.5; g.beginPath(); g.moveTo(x+16,y+9); g.lineTo(x+16,y+19); g.moveTo(x+12,y+13); g.lineTo(x+20,y+13); g.stroke(); break; }
  case 'O': { g.fillStyle='rgba(0,0,0,.3)'; ell(g,x+16,y+27,8,3); g.fill(); g.fillStyle='#6b4a2e'; rr(g,x+11,y+6,10,22,3); g.fill(); g.fillStyle='#8c6440'; g.fillRect(x+12,y+7,3,20); g.strokeStyle='#d9b45a'; g.lineWidth=3; circ(g,x+16,y+8,6); g.stroke(); g.strokeStyle='#fff1b0'; g.lineWidth=1; g.beginPath(); g.arc(x+16,y+8,6,3.6,4.6); g.stroke(); break; }
  case 'm': { const col=room.w==='ow'?(h>0.5?'#d9483b':'#9b5bd6'):(h>0.5?'#b16bd8':'#5fd0b9');
    g.fillStyle='rgba(0,0,0,.25)'; ell(g,x+16,y+27,10,4); g.fill(); g.fillStyle='#efe3c9'; rr(g,x+12,y+14,8,13,3); g.fill(); g.fillStyle=col; g.beginPath(); g.ellipse(x+16,y+14,13,9,0,Math.PI,0); g.fill(); g.fillStyle='rgba(255,255,255,.8)'; circ(g,x+10,y+11,2); g.fill(); circ(g,x+19,y+9,2.5); g.fill(); circ(g,x+23,y+12,1.5); g.fill(); break; }
  case 'u': { g.fillStyle='#6b4a2e'; ell(g,x+16,y+20,10,7); g.fill(); g.fillStyle='#c79a63'; ell(g,x+16,y+17,9,5); g.fill(); break; }
  case 'E': { if(room.w==='ow'){ g.fillStyle='#14101a'; g.beginPath(); g.moveTo(x+3,y+TS); g.lineTo(x+3,y+12); g.arc(x+16,y+12,13,Math.PI,0); g.lineTo(x+29,y+TS); g.closePath(); g.fill(); g.strokeStyle='#4a4048'; g.lineWidth=3; g.stroke(); }
    else { g.fillStyle='#120e18'; g.fillRect(x+3,y+3,TS-6,TS-6); g.fillStyle=th.wallTop; for(let i=0;i<4;i++) g.fillRect(x+5,y+6+i*6,TS-10,2); } break; }
 }
}
function drawCracks(g,x,y,col){ g.strokeStyle=col; g.lineWidth=1.6; g.beginPath(); g.moveTo(x+16,y+4); g.lineTo(x+13,y+12); g.lineTo(x+18,y+17); g.lineTo(x+12,y+26); g.moveTo(x+18,y+17); g.lineTo(x+25,y+21); g.moveTo(x+13,y+12); g.lineTo(x+7,y+14); g.stroke(); }
function drawWaterBase(g,x,y){ const d2=room.w==='d2'; g.fillStyle=d2?'#1f5f73':'#2f7fb0'; g.fillRect(x,y,TS,TS); g.fillStyle=d2?'#236a80':'#3a8dc0'; g.fillRect(x,y+TS/2,TS,TS/2); }

function buildCache(){
 if(!room.cache){ room.cache=document.createElement('canvas'); room.cache.width=VW*2; room.cache.height=VH*2; }
 const g=room.cache.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,VW,VH);
 const dyn='LXYDJpCM[]l';
 for(let ty=0;ty<CH;ty++) for(let tx=0;tx<CW;tx++){ const c=room.grid[ty][tx]; if(dyn.includes(c)) drawGround(g, c==='L'?'P':baseFor(c), tx*TS,ty*TS,tx,ty); }
 // prima terreno, poi oggetti alti (alberi sovrapposti dall'alto verso il basso)
 for(let ty=0;ty<CH;ty++) for(let tx=0;tx<CW;tx++){ const c=room.grid[ty][tx]; if(!dyn.includes(c)&&c!=='T') drawStaticTile(g,c,tx,ty); }
 for(let ty=0;ty<CH;ty++) for(let tx=0;tx<CW;tx++){ const c=room.grid[ty][tx]; if(c==='T') drawStaticTile(g,c,tx,ty); }
 watercolorize(room.cache,room.key);
 room.trees=[]; for(let ty=0;ty<CH;ty++) for(let tx=0;tx<CW;tx++) if(room.grid[ty][tx]==='T') room.trees.push([tx,ty]);
 room.dirty=false;
}

// tile dinamici (animati o con stato)
function drawDynTiles(g){
 const th=THEME[room.w];
 for(let ty=0;ty<CH;ty++) for(let tx=0;tx<CW;tx++){
  const c=room.grid[ty][tx], x=tx*TS, y=ty*TS;
  switch(c){
   case 'W': { const t=T*1.4+tx*0.7+ty*0.4; g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=1.5; g.beginPath(); const o=Math.sin(t)*4; g.moveTo(x+4+o,y+10); g.quadraticCurveTo(x+10+o,y+7,x+16+o,y+10); g.moveTo(x+14-o,y+22); g.quadraticCurveTo(x+20-o,y+19,x+26-o,y+22); g.stroke();
     if(hash(tx,ty,(T*2)|0)>0.985){ addPart({x:x+rand(4,28),y:y+rand(4,28),vx:0,vy:0,life:0.6,col:'#e8fbff',size:2,type:'spark'}); } break; }
   case 'X': case 'Y': { g.fillStyle='rgba(0,0,0,.3)'; ell(g,x+16,y+28,10,3.5); g.fill(); g.fillStyle='#4b4450'; rr(g,x+8,y+14,16,14,3); g.fill(); g.fillStyle='#6d6573'; rr(g,x+6,y+10,20,7,3); g.fill(); g.fillStyle='#2a242e'; ell(g,x+16,y+12,8,2.5); g.fill();
     if(c==='Y'){ const f=Math.sin(T*18+tx)*1.5; const gr=g.createRadialGradient(x+16,y+6,1,x+16,y+6,12); gr.addColorStop(0,'#fff6c2'); gr.addColorStop(0.4,'#ffb43a'); gr.addColorStop(1,'rgba(255,90,20,0)'); g.fillStyle=gr; g.beginPath(); g.moveTo(x+9,y+12); g.quadraticCurveTo(x+10+f,y-2,x+16,y-8+f); g.quadraticCurveTo(x+22-f,y-2,x+23,y+12); g.closePath(); g.fill();
       if(Math.random()<0.08) addPart({x:x+16+rand(-4,4),y:y+2,vx:rand(-10,10),vy:rand(-50,-30),life:0.7,col:'#ffcf6b',size:1.6,type:'ember'}); } break; }
   case 'L': { if(tileAt(tx-1,ty)==='L'||tileAt(tx,ty-1)==='L') break; drawGreatLantern(g,x+32,y+50); break; }
   case 'D': { g.fillStyle=th.wall; g.fillRect(x,y,TS,TS); g.fillStyle='#7a4f2c'; rr(g,x+2,y+2,TS-4,TS-4,3); g.fill(); g.strokeStyle='#4d2f19'; g.lineWidth=2; for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(x+i*8,y+3); g.lineTo(x+i*8,y+TS-3); g.stroke(); }
     g.fillStyle='#c9a24a'; circ(g,x+16,y+15,5); g.fill(); g.fillStyle='#2a1a0e'; circ(g,x+16,y+14,1.8); g.fill(); g.fillRect(x+15,y+14,2,5); break; }
   case 'J': { const k=room.jOpen?0:1; g.fillStyle=room.w==='ow'?'#5a4a3a':th.wall; g.globalAlpha=0.4; g.fillRect(x,y,TS,TS); g.globalAlpha=1; if(k){ g.fillStyle='#3d3542'; g.fillRect(x,y,TS,TS); g.fillStyle='#8b8094'; for(let i=0;i<4;i++){ rr(g,x+3+i*7,y+1,4,TS-2,2); g.fill(); } g.fillStyle=th.acc; g.globalAlpha=0.5+Math.sin(T*3)*0.2; g.fillRect(x,y+TS/2-1,TS,2); g.globalAlpha=1; } break; }
   case 'p': { const on=!!blockAt(tx,ty)||(P&&Math.floor(P.x/TS)===tx&&Math.floor((P.y-2)/TS)===ty); g.fillStyle='#2b2630'; rr(g,x+4,y+4,TS-8,TS-8,4); g.fill(); g.fillStyle=on?'#7de0a0':th.acc; rr(g,x+7,y+(on?9:7),TS-14,TS-14-(on?2:0),3); g.fill(); g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(x+8,y+(on?10:8),TS-16,2); break; }
   case 'C': { const open=!!S.got[gk('C',tx,ty)]; g.fillStyle='rgba(0,0,0,.3)'; ell(g,x+16,y+28,13,4); g.fill(); g.fillStyle='#8a5a2b'; rr(g,x+4,y+12,24,16,3); g.fill(); g.fillStyle='#d6a648'; g.fillRect(x+4,y+17,24,3); g.fillRect(x+14,y+12,4,16);
     if(open){ g.fillStyle='#3a2414'; rr(g,x+5,y+8,22,6,2); g.fill(); g.fillStyle='#a8743c'; rr(g,x+4,y+2,24,8,3); g.fill(); }
     else { g.fillStyle='#a8743c'; g.beginPath(); g.moveTo(x+4,y+14); g.quadraticCurveTo(x+16,y+4,x+28,y+14); g.closePath(); g.fill(); g.fillStyle='#ffe08a'; circ(g,x+16,y+18,2.2); g.fill(); if(Math.random()<0.03) addPart({x:x+rand(6,26),y:y+rand(8,20),vx:0,vy:-10,life:0.7,col:'#fff2b0',size:2,type:'spark'}); } break; }
   case 'M': { if(S.flames>=3){ g.fillStyle='rgba(200,160,255,.08)'; g.fillRect(x,y,TS,TS); break; } const gr=g.createLinearGradient(x,y,x,y+TS); gr.addColorStop(0,'rgba(180,120,255,.85)'); gr.addColorStop(1,'rgba(90,40,160,.85)'); g.fillStyle=gr; g.fillRect(x,y,TS,TS);
     g.strokeStyle='rgba(255,230,255,.6)'; g.lineWidth=1; for(let i=0;i<3;i++){ g.beginPath(); const o=(T*20+i*11)%TS; g.moveTo(x,y+o); g.lineTo(x+TS,y+o-6); g.stroke(); }

 // blocchi spingibili

 else h='Abbiamo salvato Brumafonda! Ma ci sono ancora segreti in giro...';
 const extra=[];
 if(S.fireflies<TOTAL_FIREFLIES) extra.push(`Lumini ritrovati: ${S.fireflies}/${TOTAL_FIREFLIES}. Alcune si nascondono dietro rovi, rocce incrinate o... nei favori che fai alla gente.`);

const EDGE_WALK=c=>!'THRWBVFL#XYZQCsgOlmM[]KuG'.includes(c);
function roomStep(from,to){
 if(from===to) return null;
 const q=[from], prev={[from]:null};
 while(q.length){ const k=q.shift(); if(k===to) break; const [w,xy]=k.split(':'); const [x,y]=xy.split(',').map(Number); const m=ROOMS[k].map;
  const tryN=(dx,dy,ok)=>{ const n=w+':'+(x+dx)+','+(y+dy); if(ROOMS[n]&&ok&&!(n in prev)){ prev[n]=k; q.push(n); } };
  tryN(-1,0,m.some(r=>EDGE_WALK(r[0]))); tryN(1,0,m.some(r=>EDGE_WALK(r[15]))); tryN(0,-1,[...m[0]].some(EDGE_WALK)); tryN(0,1,[...m[10]].some(EDGE_WALK)); }
 if(!(to in prev)) return null;
 let k=to; while(prev[k]!==from) k=prev[k];
 const a=from.split(':')[1].split(',').map(Number), b=k.split(':')[1].split(',').map(Number); return [b[0]-a[0],b[1]-a[1]];
}

 P.kbx*=Math.exp(-dt*9); P.kby*=Math.exp(-dt*9);

 // porte e blocchi
 const hit=r.hitX||r.hitY;
 if(hit){ const c=tileAt(hit.tx,hit.ty);
  if(c==='D') tryUnlock(hit.tx,hit.ty);
  const b=blockAt(hit.tx,hit.ty);

function updateHook(dt){

  let steps=Math.ceil(SP*dt/6);
  for(let i=0;i<steps;i++){ h.x+=h.dx*6; h.y+=h.dy*6; h.d+=6;
   const tx=Math.floor(h.x/TS), ty=Math.floor((h.y+4)/TS), c=tileAt(tx,ty);
   if(c==='O'){ const lx=tx-h.dx, ly=ty-h.dy; h.state='pull'; h.tx=lx*TS+16; h.ty=ly*TS+22; h.x=tx*TS+16; h.y=ty*TS+8; AU.sfx('clink'); burst(h.x,h.y,['#fff','#ffe08a'],6,60,2,'spark'); return; }
   if(solidProj(tx,ty)){ h.state='back'; AU.sfx('clink'); burst(h.x,h.y,['#fff'],5,60,2,'spark'); break; }
   let stop=false;
   for(const e of ents){ if(e.dead) continue; const ez=e.z||0;
    if(e.enemy&&dist(e.x,e.y-10-ez,h.x,h.y)<e.r+6){ const d=EDEF[e.kind]; if(d.onHook){ d.onHook(e); } else stunEnemy(e,2.5); h.state='back'; stop=true; break; }
    if(['shell','heart','firefly','piece','page','keyp'].includes(e.kind)&&dist(e.x,e.y-8,h.x,h.y)<14){ h.carry=e; h.state='back'; stop=true; break; } }
   if(stop) break;
   if(h.d>=7*TS){ h.state='back'; break; }
  }
 } else if(h.state==='back'){
  const tx=P.x, ty=P.y-10, a=Math.atan2(ty-h.y,tx-h.x); h.x+=Math.cos(a)*SP*1.2*dt; h.y+=Math.sin(a)*SP*1.2*dt;
  if(h.carry){ h.carry.x=h.x; h.carry.y=h.y+8; }
  if(dist(h.x,h.y,tx,ty)<14){ if(h.carry) collect(h.carry); P.hook=null; }
 } else if(h.state==='pull'){
  const a=Math.atan2(h.ty-P.y,h.tx-P.x), d=dist(P.x,P.y,h.tx,h.ty), s=Math.min(d,420*dt);

function drawPart(g,p){

  case 'glass': g.save(); g.translate(p.x,p.y); g.rotate(p.life*10); g.fillStyle=p.col; g.globalAlpha=a; g.beginPath(); g.moveTo(0,-p.size); g.lineTo(p.size*0.8,p.size*0.6); g.lineTo(-p.size*0.6,p.size*0.4); g.fill(); g.restore(); g.globalAlpha=1; break;
  case 'splat': { const r=p.size*(1.8-a*0.8); const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r); gr.addColorStop(0,p.col); gr.addColorStop(0.75,p.col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.globalAlpha=a*0.35; g.fillStyle=gr; circ(g,p.x,p.y,r); g.fill(); g.globalAlpha=a*0.25; g.strokeStyle=p.col; g.lineWidth=1.5; circ(g,p.x,p.y,r*0.92); g.stroke(); g.globalAlpha=1; break; }
  case 'smoke': g.fillStyle=p.col; g.globalAlpha=a*0.6; circ(g,p.x,p.y,p.size*(1.6-a*0.6)); g.fill(); g.globalAlpha=1; break;
  case 'bubble': g.strokeStyle=p.col; g.lineWidth=1; g.globalAlpha=Math.min(1,p.life); circ(g,p.x+Math.sin(p.life*5)*2,p.y,p.size); g.stroke(); g.globalAlpha=1; break;

  case 'mote': g.fillStyle=p.col; g.globalAlpha=Math.sin(a*Math.PI)*0.9; circ(g,p.x+Math.sin(p.life*3)*3,p.y,p.size); g.fill(); g.globalAlpha=1; break;
  case 'ash': g.fillStyle=p.col; g.globalAlpha=Math.min(1,p.life*0.5); g.fillRect(p.x+Math.sin(p.life*2)*6,p.y,p.size,p.size*0.7); g.globalAlpha=1; break;

  default: g.fillStyle=p.col; g.globalAlpha=a; circ(g,p.x,p.y,p.size*(0.4+a*0.6)); g.fill(); g.globalAlpha=1;
 }
}

function wrap(g,text,maxW){ const out=[]; for(const para of text.split('\n')){ if(!para){ out.push(''); continue; } let line=''; for(const w of para.split(' ')){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW&&line){ out.push(line); line=w; } else line=t; } out.push(line); } return out; }
